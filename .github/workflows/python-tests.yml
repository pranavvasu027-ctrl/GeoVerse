name: GeoVerse Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests flask pandas numpy scikit-learn joblib

    - name: Compile Model 3 C++ Engine (Linux Native)
      run: |
        cd models/model-3-smart-root-optimizer
        bash build.sh
        cd ../..

    - name: Run Full Test Suite
      env:
        PYTHONPATH: ${{ github.workspace }}/models/model-1-lulc-urban-growth:${{ github.workspace }}/models/model-2-property-valuation/src:${{ github.workspace }}/models/model-3-smart-root-optimizer
      run: |
        pytest -v
